browser:
  # Must remain outside the repository. Environment variables are expanded.
  user_data_dir: &browser_profile "%LOCALAPPDATA%/video-agent/browser-profile"
  headless: false
  # Reuse locally installed Chromium-based Chrome; remove this after installing
  # Playwright's bundled Chromium if preferred.
  channel: "chrome"
  timeout_ms: 30000

runtime_dir: "../../Media/video-downloads/runtime"

download:
  output_dir: "../../Media/video-downloads"
  log_dir: "../../Media/video-downloads/logs"
  format: "bestvideo*+bestaudio/best"
  retries: 5
  socket_timeout: 30
  cookies_from_browser:
    enabled: true
    browser: "chrome"
    profile: *browser_profile
